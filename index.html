<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus — Tâches, Mails & Projets</title>
<meta name="description" content="Reste organisé, atteins tes objectifs.">
<meta name="theme-color" content="#6C5FF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Focus">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236C5FF5'/%3E%3Cpath d='M30 52l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%236C5FF5'/%3E%3Cpath d='M30 52l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#EDEFF9; --card:#FFFFFF; --ink:#1B1C31; --muted:#8A8FA8; --line:#ECEDF5;
  --violet:#6C5FF5; --violet-2:#8B7DF8; --violet-soft:#EEEBFE;
  --green:#2EBD7E; --green-soft:#E3F7EE;
  --orange:#F59E42; --orange-soft:#FEF3E6;
  --blue:#4D9DF6; --blue-soft:#E8F2FE;
  --red:#F0506E; --red-soft:#FDEAEE;
  --r:18px; --shadow:0 6px 24px rgba(50,50,93,.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#DFE2F2; color:var(--ink); font-size:15px; line-height:1.45;
}
#app{
  max-width:440px; min-height:100dvh; margin:0 auto; background:var(--bg);
  position:relative; display:flex; flex-direction:column;
  box-shadow:0 0 60px rgba(40,40,80,.12);
}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--violet)}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
h2{font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.screen{display:none;flex:1;flex-direction:column;padding:22px 18px 110px;animation:fade .22s ease}
.screen.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- Auth ---------- */
#auth{display:flex;min-height:100dvh;flex-direction:column;justify-content:center;padding:34px 26px;gap:8px;
  background:linear-gradient(180deg,#F2F3FB 0%,#E6E4FB 55%,#C9C2F4 100%)}
.logo-tile{width:74px;height:74px;border-radius:22px;background:linear-gradient(135deg,var(--violet),var(--violet-2));
  display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 12px 28px rgba(108,95,245,.35)}
#auth h1{text-align:center}
#auth .tagline{text-align:center;color:#5A5C7A;margin:6px 0 26px}
.field label{display:block;font-size:13px;font-weight:600;margin:0 0 6px 4px;color:#4A4C68}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:15px;
  font-weight:700;font-size:15.5px;transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;box-shadow:0 8px 20px rgba(108,95,245,.32)}
.btn-ghost{color:var(--violet);font-weight:600}
.auth-error{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 14px;font-size:13.5px;display:none}

/* ---------- Header ---------- */
.greet .hello{font-size:15px;color:#56587a}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#A99CFA,#6C5FF5);
  color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;position:relative;border:0}
.avatar::after{content:"";position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;
  background:var(--green);border:2.5px solid var(--bg)}

/* ---------- Vue d'ensemble ---------- */
.overview{background:linear-gradient(135deg,#8B7DF8 0%,#6C5FF5 60%,#5B4DE0 100%);color:#fff;
  border-radius:22px;padding:18px;box-shadow:0 14px 30px rgba(108,95,245,.35)}
.overview .title{font-size:13px;font-weight:600;opacity:.9;margin-bottom:12px}
.ov-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ov-cell{background:rgba(255,255,255,.16);border-radius:16px;padding:12px 10px;backdrop-filter:blur(4px)}
.ov-cell .lab{font-size:12px;opacity:.85}
.ov-cell .val{font-size:21px;font-weight:800;margin:2px 0 6px}
.ov-cell .sub{font-size:10.5px;opacity:.75}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:7px}
.bar > i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s ease}

/* ---------- Sections ---------- */
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.link{color:var(--violet);font-weight:600;font-size:13px}

/* ---------- Items tâches ---------- */
.task{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;
  box-shadow:var(--shadow);padding:14px 15px;width:100%;text-align:left}
.check{width:24px;height:24px;min-width:24px;border-radius:50%;border:2px solid #C9CBE0;display:grid;place-items:center;
  background:#fff;transition:all .15s ease}
.check svg{opacity:0;transform:scale(.5);transition:all .15s ease}
.task.done .check{background:var(--violet);border-color:var(--violet)}
.task.done .check svg{opacity:1;transform:scale(1)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-body{flex:1;min-width:0}
.t-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub{font-size:12px;color:var(--muted);margin-top:2px}
.chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.haute{background:var(--red-soft);color:var(--red)}
.chip.moyenne{background:var(--orange-soft);color:var(--orange)}
.chip.basse{background:var(--blue-soft);color:var(--blue)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.encours{background:var(--green-soft);color:var(--green)}
.chip.viol{background:var(--violet-soft);color:var(--violet)}
.chev{color:#C2C5DA}

/* ---------- Événements ---------- */
.event{display:flex;gap:14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:13px 15px}
.event .time{font-weight:700;font-size:13.5px;min-width:46px}
.event .pipe{width:3.5px;border-radius:99px}
.event .what{font-weight:600;font-size:14px}

/* ---------- Filtres / segments ---------- */
.segs{display:flex;gap:8px;margin:14px 0 6px;overflow-x:auto;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.seg{padding:8px 15px;border-radius:99px;background:#fff;color:#62648a;font-weight:600;font-size:13px;
  box-shadow:var(--shadow);white-space:nowrap}
.seg .n{opacity:.6;margin-left:4px}
.seg.active{background:var(--violet);color:#fff}
.group-label{font-size:13px;font-weight:700;color:#54567a;margin:18px 2px 8px}

/* ---------- Mails ---------- */
.mail{display:flex;gap:12px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:14px 15px;width:100%;text-align:left;align-items:flex-start}
.m-avatar{width:42px;height:42px;min-width:42px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:15px}
.m-body{flex:1;min-width:0}
.m-top{display:flex;justify-content:space-between;gap:8px}
.m-from{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-date{font-size:11.5px;color:var(--muted);white-space:nowrap}
.m-subj{font-size:13.5px;font-weight:600;color:#3c3e5c;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-prev{font-size:12.5px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{width:9px;height:9px;border-radius:50%;background:var(--violet);margin-top:6px}
.mail.read .m-from{font-weight:600;color:#54567a}
.mail.read .dot{visibility:hidden}

/* ---------- Projets ---------- */
.proj{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;width:100%;text-align:left}
.p-icon{width:44px;height:44px;min-width:44px;border-radius:13px;display:grid;place-items:center;color:#fff}
.p-bar{height:6px;border-radius:99px;background:#EEEFF7;overflow:hidden;margin-top:12px}
.p-bar > i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.p-meta{font-size:12px;color:var(--muted);margin-top:9px}
.pct{font-weight:800;font-size:14px}

/* ---------- Détail ---------- */
.detail-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.icon-btn{width:40px;height:40px;border-radius:13px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;color:#3c3e5c}
.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.meta-cell{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px;text-align:center}
.meta-cell .k{font-size:11px;color:var(--muted)}
.meta-cell .v{font-size:12.5px;font-weight:700;margin-top:3px}
.subtask{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.subtask:last-child{border-bottom:0}
.subtask.done span{text-decoration:line-through;color:var(--muted)}
.cta{position:sticky;bottom:96px;margin-top:auto}

/* ---------- Nav ---------- */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:40}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:#9A9DB8;width:62px}
.nav-btn.active{color:var(--violet)}
#fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--violet-2));
  color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(108,95,245,.45);margin-top:-26px;transition:transform .1s}
#fab:active{transform:scale(.93)}

/* ---------- Modales ---------- */
.veil{position:fixed;inset:0;background:rgba(20,20,45,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.veil.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:20px 18px calc(26px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:4.5px;border-radius:99px;background:#D4D6E6;margin:0 auto 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:104px;background:#23243d;color:#fff;
  padding:11px 18px;border-radius:13px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:90;
  box-shadow:0 10px 26px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:13.5px}
.danger{color:var(--red);font-weight:700}
.settings-row{display:flex;align-items:center;gap:13px;background:#fff;border-radius:15px;box-shadow:var(--shadow);
  padding:14px 15px;width:100%;text-align:left;font-weight:600;font-size:14.5px}
.s-ic{width:36px;height:36px;min-width:36px;border-radius:11px;display:grid;place-items:center}
</style>
</head>
<body>
<div id="app">

  <!-- ÉCRAN AUTH -->
  <section id="auth">
    <div class="logo-tile">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4 8-9"/></svg>
    </div>
    <h1 id="auth-title">Crée ton compte</h1>
    <p class="tagline">Reste organisé, atteins tes objectifs.</p>
    <div class="stack">
      <div class="auth-error" id="auth-error"></div>
      <div class="field" id="f-name">
        <label for="in-name">Prénom</label>
        <input id="in-name" placeholder="Ex. William" autocomplete="given-name">
      </div>
      <div class="field">
        <label for="in-user">Identifiant</label>
        <input id="in-user" placeholder="Ton identifiant" autocomplete="username">
      </div>
      <div class="field">
        <label for="in-pass">Mot de passe</label>
        <input id="in-pass" type="password" placeholder="6 caractères minimum" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="auth-go" style="margin-top:6px">Commencer</button>
      <button class="btn btn-ghost" id="auth-switch">J'ai déjà un compte — Se connecter</button>
    </div>
  </section>

  <!-- ACCUEIL -->
  <section class="screen" id="screen-home">
    <div class="spread">
      <div class="greet">
        <div class="hello">Bonjour</div>
        <h1><span id="g-name">…</span> 👋</h1>
        <div class="small muted" style="margin-top:3px">Concentre-toi sur l'essentiel aujourd'hui.</div>
      </div>
      <button class="avatar" id="open-settings" aria-label="Paramètres">W</button>
    </div>

    <div class="overview" style="margin-top:18px">
      <div class="title">Vue d'ensemble</div>
      <div class="ov-grid">
        <div class="ov-cell"><div class="lab">Travail</div><div class="val" id="ov-work">0%</div><div class="sub" id="ov-work-sub">0 / 0 tâches</div><div class="bar"><i id="ov-work-bar" style="width:0%"></i></div></div>
        <div class="ov-cell"><div class="lab">Mails</div><div class="val" id="ov-mail">0</div><div class="sub">non lus</div><div class="bar"><i id="ov-mail-bar" style="width:0%"></i></div></div>
        <div class="ov-cell"><div class="lab">Projets</div><div class="val" id="ov-proj">0%</div><div class="sub" id="ov-proj-sub">0 projet</div><div class="bar"><i id="ov-proj-bar" style="width:0%"></i></div></div>
      </div>
    </div>

    <div class="section-head"><h2>Tâches du jour</h2><button class="link" data-nav="work">Voir tout</button></div>
    <div class="stack" id="home-tasks"></div>

    <div class="section-head"><h2>Prochains événements</h2><button class="link" id="add-event">Ajouter</button></div>
    <div class="stack" id="home-events"></div>
  </section>

  <!-- TRAVAIL -->
  <section class="screen" id="screen-work">
    <div class="spread"><h1>Travail</h1></div>
    <div class="segs" id="work-filters">
      <button class="seg active" data-f="all">Toutes <span class="n"></span></button>
      <button class="seg" data-f="todo">À faire <span class="n"></span></button>
      <button class="seg" data-f="done">Terminées <span class="n"></span></button>
    </div>
    <div id="work-list"></div>
  </section>

  <!-- MAILS -->
  <section class="screen" id="screen-mails">
    <div class="spread"><h1>Mails</h1></div>
    <div class="segs" id="mail-filters">
      <button class="seg active" data-f="in">Boîte de réception <span class="n"></span></button>
      <button class="seg" data-f="sent">Envoyés <span class="n"></span></button>
    </div>
    <div class="stack" id="mail-list" style="margin-top:8px"></div>
  </section>

  <!-- PROJETS -->
  <section class="screen" id="screen-projects">
    <div class="spread"><h1>Projets</h1></div>
    <div class="segs" id="proj-filters">
      <button class="seg active" data-f="all">Tous</button>
      <button class="seg" data-f="run">En cours</button>
      <button class="seg" data-f="done">Terminés</button>
    </div>
    <div class="stack" id="proj-list" style="margin-top:8px"></div>
  </section>

  <!-- NAVIGATION -->
  <nav id="nav" style="display:none">
    <button class="nav-btn active" data-nav="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Accueil</button>
    <button class="nav-btn" data-nav="work"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7V5.5A2.5 2.5 0 0 1 10.5 3h3A2.5 2.5 0 0 1 16 5.5V7"/></svg>Travail</button>
    <button id="fab" aria-label="Ajouter"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="nav-btn" data-nav="mails"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 7l9 6 9-6"/></svg>Mails</button>
    <button class="nav-btn" data-nav="projects"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Projets</button>
  </nav>

  <!-- MODALES (remplies par JS) -->
  <div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ================= Stockage (localStorage + repli mémoire) ================= */
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};

/* ================= PWA : manifest dynamique ================= */
(function(){
  const manifest = {
    name:"Focus — Tâches, Mails & Projets", short_name:"Focus", start_url:".", scope:".",
    display:"standalone", background_color:"#EDEFF9", theme_color:"#6C5FF5",
    icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236C5FF5'/%3E%3Cpath d='M30 52l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E",
      sizes:"512x512", type:"image/svg+xml", purpose:"any"}]
  };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(link);
})();

/* ================= Utilitaires ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
async function hash(str){
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('focus·'+str));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0; for(const c of 'focus·'+str){ h=(h*31 + c.charCodeAt(0))|0; } return 'f'+(h>>>0).toString(16);
  }
}
const AV_COLORS = ['#6C5FF5','#F59E42','#2EBD7E','#4D9DF6','#F0506E','#9B59B6'];
const avColor = name => AV_COLORS[[...name].reduce((a,c)=>a+c.charCodeAt(0),0)%AV_COLORS.length];
const initials = name => name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();

/* ================= Données ================= */
let session = null;   // {user, name}
let D = null;         // données de l'utilisateur courant
const dataKey = u => 'focus_data_'+u;

/* ================= Auth ================= */
let authMode = 'signup';
function usersDB(){ try{ return JSON.parse(store.get('focus_users')||'{}'); }catch(e){ return {}; } }
function authError(msg){ const e=$('#auth-error'); e.textContent=msg; e.style.display='block'; }

$('#auth-switch').onclick = () => {
  authMode = authMode==='signup' ? 'login' : 'signup';
  $('#auth-title').textContent = authMode==='signup' ? 'Crée ton compte' : 'Content de te revoir';
  $('#f-name').style.display = authMode==='signup' ? 'block' : 'none';
  $('#auth-go').textContent = authMode==='signup' ? 'Commencer' : 'Se connecter';
  $('#auth-switch').textContent = authMode==='signup' ? "J'ai déjà un compte — Se connecter" : 'Créer un nouveau compte';
  $('#auth-error').style.display='none';
};

$('#auth-go').onclick = async () => {
  const name = $('#in-name').value.trim();
  const user = $('#in-user').value.trim().toLowerCase();
  const pass = $('#in-pass').value;
  if(!user) return authError('Indique ton identifiant.');
  if(pass.length < 6) return authError('Le mot de passe doit faire au moins 6 caractères.');
  const db = usersDB();
  const h = await hash(pass);
  if(authMode==='signup'){
    if(!name) return authError('Indique ton prénom.');
    if(db[user]) return authError('Cet identifiant existe déjà. Connecte-toi plutôt.');
    db[user] = {name, hash:h};
    store.set('focus_users', JSON.stringify(db));
    store.set(dataKey(user), JSON.stringify(seedData()));
  }else{
    if(!db[user]) return authError('Identifiant inconnu. Crée d’abord un compte.');
    if(db[user].hash !== h) return authError('Mot de passe incorrect.');
  }
  session = {user, name: db[user].name};
  store.set('focus_session', JSON.stringify(session));
  enterApp();
};
$('#in-pass').addEventListener('keydown', e => { if(e.key==='Enter') $('#auth-go').click(); });

function enterApp(){
  try{ D = JSON.parse(store.get(dataKey(session.user))) || seedData(); }catch(e){ D = seedData(); }
  $('#auth').style.display='none';
  $('#nav').style.display='flex';
  $('#g-name').textContent = session.name;
  $('#open-settings').textContent = initials(session.name);
  go('home');
}
function logout(){
  store.del('focus_session'); closeSheet();
  $('#nav').style.display='none';
  $$('.screen').forEach(s=>s.classList.remove('active'));
  $('#auth').style.display='flex';
  $('#in-pass').value='';
}

/* ================= Navigation ================= */
let current = 'home';
function go(name){
  current = name;
  $$('.screen').forEach(s=>s.classList.remove('active'));
  $('#screen-'+name).classList.add('active');
  $$('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.nav===name));
  render();
  window.scrollTo({top:0});
}
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if(nav) go(nav.dataset.nav);
});

/* ================= Rendus ================= */
const checkSVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l5 5 9-11"/></svg>';
let workFilter = 'all', mailFolder = 'in', projFilter = 'all';

function counts(){
  const t = D.tasks, done = t.filter(x=>x.done).length;
  const unread = D.mails.filter(m=>m.folder==='in' && !m.read).length;
  const pct = p => { const n=p.items.length; return n? Math.round(p.items.filter(i=>i.done).length/n*100):0; };
  const avg = D.projects.length ? Math.round(D.projects.reduce((a,p)=>a+pct(p),0)/D.projects.length) : 0;
  return {done, total:t.length, unread, inbox:D.mails.filter(m=>m.folder==='in').length, projAvg:avg, pct};
}

function taskHTML(t, sub){
  return `<button class="task ${t.done?'done':''}" data-task="${t.id}">
    <span class="check" data-toggle="${t.id}">${checkSVG}</span>
    <span class="t-body"><span class="t-title">${esc(t.title)}</span><span class="t-sub" style="display:block">${esc(sub)}</span></span>
    ${t.priority==='Haute' && !t.done ? '<span class="chip haute">Haute</span>':''}
    <span class="chev">›</span></button>`;
}

function render(){
  const c = counts();
  /* Accueil */
  $('#ov-work').textContent = (c.total? Math.round(c.done/c.total*100):0)+'%';
  $('#ov-work-sub').textContent = `${c.done} / ${c.total} tâches`;
  $('#ov-work-bar').style.width = (c.total? c.done/c.total*100:0)+'%';
  $('#ov-mail').textContent = c.unread;
  $('#ov-mail-bar').style.width = (c.inbox? (1-c.unread/c.inbox)*100:100)+'%';
  $('#ov-proj').textContent = c.projAvg+'%';
  $('#ov-proj-sub').textContent = D.projects.length+' projet'+(D.projects.length>1?'s':'');
  $('#ov-proj-bar').style.width = c.projAvg+'%';

  const todays = D.tasks.filter(t=>t.when==='today');
  $('#home-tasks').innerHTML = todays.length
    ? todays.map(t=>taskHTML(t, t.done?'Terminée':'À faire · '+todayStr())).join('')
    : '<div class="card empty">Aucune tâche aujourd\'hui. Profite-en 🎉</div>';

  $('#home-events').innerHTML = D.events.length
    ? D.events.map(ev=>`<div class="event"><span class="time">${esc(ev.time)}</span><span class="pipe" style="background:${ev.color}"></span><span style="flex:1"><span class="what" style="display:block">${esc(ev.title)}</span><span class="small muted">${esc(ev.place)}</span></span><button class="muted" data-del-event="${ev.id}" aria-label="Supprimer">✕</button></div>`).join('')
    : '<div class="card empty">Aucun événement à venir.</div>';

  /* Travail */
  $$('#work-filters .seg').forEach(b=>{
    b.classList.toggle('active', b.dataset.f===workFilter);
    b.querySelector('.n').textContent = b.dataset.f==='all'? c.total : b.dataset.f==='todo'? c.total-c.done : c.done;
  });
  const groups = [['today','Aujourd\'hui'],['tomorrow','Demain'],['later','Plus tard']];
  let wl = '';
  for(const [k,label] of groups){
    const items = D.tasks.filter(t=>t.when===k && (workFilter==='all' || (workFilter==='done')===t.done));
    if(!items.length) continue;
    wl += `<div class="group-label">${label}</div><div class="stack">` +
      items.map(t=>taskHTML(t, t.done?'Terminée':'À faire')).join('') + '</div>';
  }
  $('#work-list').innerHTML = wl || '<div class="card empty">Rien ici pour le moment. Ajoute une tâche avec le bouton +.</div>';

  /* Mails */
  $$('#mail-filters .seg').forEach(b=>{
    b.classList.toggle('active', b.dataset.f===mailFolder);
    b.querySelector('.n').textContent = b.dataset.f==='in'? c.unread : D.mails.filter(m=>m.folder==='sent').length;
  });
  const mails = D.mails.filter(m=>m.folder===mailFolder);
  $('#mail-list').innerHTML = mails.length
    ? mails.map(m=>`<button class="mail ${m.read||m.folder==='sent'?'read':''}" data-mail="${m.id}">
        <span class="m-avatar" style="background:${avColor(m.from)}">${initials(m.from)}</span>
        <span class="m-body"><span class="m-top"><span class="m-from">${esc(m.from)}</span><span class="m-date">${esc(m.date)}</span></span>
        <span class="m-subj">${esc(m.subject)}</span><span class="m-prev">${esc(m.body.split('\n')[0]||'')}</span></span>
        <span class="dot"></span></button>`).join('')
    : '<div class="card empty">Aucun mail dans ce dossier.</div>';

  /* Projets */
  $$('#proj-filters .seg').forEach(b=>b.classList.toggle('active', b.dataset.f===projFilter));
  const projs = D.projects.filter(p=>{
    const pc = c.pct(p);
    return projFilter==='all' || (projFilter==='done' ? pc===100 : pc<100);
  });
  $('#proj-list').innerHTML = projs.length
    ? projs.map(p=>{
        const pc = c.pct(p);
        return `<button class="proj" data-proj="${p.id}">
          <div class="spread"><div class="row"><span class="p-icon" style="background:${p.color}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></span>
            <span><span style="font-weight:700;display:block">${esc(p.name)}</span>
            <span class="chip ${pc===100?'ok':'encours'}" style="margin-top:3px;display:inline-block">${pc===100?'Terminé':'En cours'}</span></span></div>
            <span class="pct">${pc}%</span></div>
          <div class="p-bar"><i style="width:${pc}%;background:${p.color}"></i></div>
          <div class="p-meta">Date limite : ${esc(p.deadline||'—')} · ${p.team||1} membre${(p.team||1)>1?'s':''}</div></button>`;
      }).join('')
    : '<div class="card empty">Aucun projet dans ce filtre.</div>';
}

/* Filtres */
$('#work-filters').onclick = e => { const b=e.target.closest('.seg'); if(b){ workFilter=b.dataset.f; render(); } };
$('#mail-filters').onclick = e => { const b=e.target.closest('.seg'); if(b){ mailFolder=b.dataset.f; render(); } };
$('#proj-filters').onclick = e => { const b=e.target.closest('.seg'); if(b){ projFilter=b.dataset.f; render(); } };

function closeSheet(){ $('#veil').classList.remove('open'); }
$('#veil').addEventListener('click', e => { if(e.target.id==='veil') closeSheet(); });

/* --- Détail tâche --- */
function openTask(id){
  const t = D.tasks.find(x=>x.id===id); if(!t) return;
  const stHTML = t.subtasks.map((s,i)=>`<button class="subtask ${s.done?'done':''}" data-st="${i}">
    <span class="check" style="${s.done?'background:var(--green);border-color:var(--green)':''}">${s.done?checkSVG:''}</span><span>${esc(s.t)}</span></button>`).join('');
  openSheet(`
    <div class="spread"><h2 style="font-size:20px">${esc(t.title)}</h2>
      <span class="chip ${t.done?'ok':'viol'}">${t.done?'Terminée':'À faire'}</span></div>
    <div class="meta-grid">
      <div class="meta-cell"><div class="k">Priorité</div><div class="v">${esc(t.priority)}</div></div>
      <div class="meta-cell"><div class="k">Échéance</div><div class="v">${t.when==='today'?'Aujourd\'hui':t.when==='tomorrow'?'Demain':'Plus tard'}</div></div>
      <div class="meta-cell"><div class="k">Projet</div><div class="v">${esc(t.project||'—')}</div></div>
    </div>
    ${t.desc?`<div style="margin-top:16px"><div class="small muted" style="font-weight:700;margin-bottom:5px">Description</div><div class="card" style="font-size:14px">${esc(t.desc)}</div></div>`:''}
    ${t.subtasks.length?`<div style="margin-top:16px"><div class="small muted" style="font-weight:700;margin-bottom:5px">Sous-tâches</div><div class="card" style="padding:6px 16px" id="st-box">${stHTML}</div></div>`:''}
    <div class="stack" style="margin-top:18px">
      <button class="btn btn-primary" id="t-done-btn">${t.done?'Marquer à faire':'Marquer comme terminée'}</button>
      <button class="btn danger" id="t-del-btn">Supprimer la tâche</button>
    </div>`);
  $('#t-done-btn').onclick = () => { t.done=!t.done; if(t.done) t.subtasks.forEach(s=>s.done=true); save(); render(); closeSheet(); toast(t.done?'Tâche terminée ✓':'Tâche réouverte'); };
  $('#t-del-btn').onclick = () => { D.tasks=D.tasks.filter(x=>x.id!==id); save(); render(); closeSheet(); toast('Tâche supprimée'); };
  const box = $('#st-box');
  if(box) box.onclick = e => {
    const b = e.target.closest('[data-st]'); if(!b) return;
    const s = t.subtasks[+b.dataset.st]; s.done=!s.done;
    save(); render(); openTask(id);
  };
}

      <input id="np-name" placeholder="Nom du projet">
      <input id="np-deadline" placeholder="Date limite (ex. 30 sept. 2026)">
      <textarea id="np-desc" rows="3" placeholder="Description (optionnel)"></textarea>
      <button class="btn btn-primary" id="np-go">Créer le projet</button>
    </div>`);
  $('#np-name').focus();
  $('#np-go').onclick = () => {
    const name = $('#np-name').value.trim();
    if(!name) return toast('Donne un nom à ton projet');
    D.projects.unshift({id:uid(), name, color:AV_COLORS[D.projects.length%AV_COLORS.length], deadline:$('#np-deadline').value.trim(), team:1, desc:$('#np-desc').value.trim(), items:[]});
    save(); render(); closeSheet(); toast('Projet créé ✓');
  };
}

/* --- Nouvel événement --- */
$('#add-event').onclick = () => {
  openSheet(`
    <h2 style="font-size:20px;margin-bottom:14px">Nouvel événement</h2>
    <div class="stack">
      <input id="ne-time" type="time" value="10:00">
      <input id="ne-title" placeholder="Titre (ex. Réunion équipe)">
      <input id="ne-place" placeholder="Lieu (ex. Salle A, en visio…)">
      <button class="btn btn-primary" id="ne-go">Ajouter</button>
    </div>`);
  $('#ne-go').onclick = () => {
    const title=$('#ne-title').value.trim(); if(!title) return toast('Donne un titre');
    D.events.push({id:uid(), time:$('#ne-time').value||'—', title, place:$('#ne-place').value.trim()||'—', color:AV_COLORS[D.events.length%AV_COLORS.length]});
    D.events.sort((a,b)=>a.time.localeCompare(b.time));
    save(); render(); closeSheet(); toast('Événement ajouté ✓');
  };
};

/* --- Paramètres --- */
$('#open-settings').onclick = () => {
  openSheet(`
    <h2 style="font-size:20px;margin-bottom:14px">Paramètres</h2>
    <div class="stack">
      <div class="settings-row"><span class="s-ic" style="background:var(--violet-soft);color:var(--violet)">👤</span>
        <span style="flex:1"><b>${esc(session.name)}</b><br><span class="small muted">@${esc(session.user)}</span></span></div>
      <button class="settings-row" id="set-name"><span class="s-ic" style="background:var(--blue-soft)">✏️</span>Modifier mon prénom</button>
      <button class="settings-row" id="set-reset"><span class="s-ic" style="background:var(--orange-soft)">♻️</span>Réinitialiser les données de démo</button>
      <button class="settings-row" id="set-logout"><span class="s-ic" style="background:var(--red-soft)">🚪</span><span class="danger">Déconnexion</span></button>
    </div>`);
  $('#set-logout').onclick = logout;
  $('#set-name').onclick = () => {
    const n = prompt('Ton prénom :', session.name);
    if(n && n.trim()){ session.name=n.trim(); const db=usersDB(); if(db[session.user]){db[session.user].name=session.name; store.set('focus_users',JSON.stringify(db));} store.set('focus_session',JSON.stringify(session)); $('#g-name').textContent=session.name; $('#open-settings').textContent=initials(session.name); closeSheet(); toast('Prénom mis à jour ✓'); }
  };
  $('#set-reset').onclick = () => { D = seedData(); save(); render(); closeSheet(); toast('Données réinitialisées'); };
};

/* ================= FAB contextuel ================= */
$('#fab').onclick = () => {
  if(current==='mails') newMailSheet();
  else if(current==='projects') newProjectSheet();
  else newTaskSheet();
};

/* ================= Délégation des clics liste ================= */
document.addEventListener('click', e => {
  const tg = e.target.closest('[data-toggle]');
  if(tg){ e.stopPropagation(); const t=D.tasks.find(x=>x.id===tg.dataset.toggle); if(t){ t.done=!t.done; save(); render(); } return; }
  const tk = e.target.closest('[data-task]'); if(tk) return openTask(tk.dataset.task);
  const ml = e.target.closest('[data-mail]'); if(ml) return openMail(ml.dataset.mail);
  const pj = e.target.closest('[data-proj]'); if(pj) return openProject(pj.dataset.proj);
  const de = e.target.closest('[data-del-event]');
  if(de){ D.events=D.events.filter(x=>x.id!==de.dataset.delEvent); save(); render(); }
});

/* ================= Reprise de session ================= */
(function(){
  try{
    const s = JSON.parse(store.get('focus_session')||'null');
    if(s && usersDB()[s.user]){ session=s; enterApp(); }
  }catch(e){}
})();
</script>
</body>
</html>
